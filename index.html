<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7aa9ad"><link rel="manifest" href="manifest.json"><title>日付クイズ Final v2</title><style>:root{--pink:#f3dbe4;--yellow:#dfb53d;--brown:#6b4a2f;--blue:#3b6fd6;--teal:#7aa9ad}body{margin:0;background:var(--pink);font-family:sans-serif}.page{max-width:480px;margin:auto;padding:16px}.card{background:#fff;border-radius:24px;overflow:hidden}.header{height:90px;background:var(--yellow);position:relative}.ring{position:absolute;top:16px;width:22px;height:56px;background:var(--brown);border-radius:12px}.l{left:25%}.r{right:25%}.content{padding:20px}.guide{text-align:center;color:#d96c72;font-size:24px}.md{display:flex;justify-content:center;gap:24px;margin-top:20px}.grp{text-align:center}.date{width:96px;height:96px;font-size:52px;text-align:center;border-radius:16px;border:2px solid #ddd}.lbl{color:var(--blue);font-size:24px;font-weight:800}.weekday{text-align:center;margin-top:20px}.week{width:48px;height:48px;font-size:24px}.btn{width:100%;height:68px;background:var(--teal);color:#fff;border:none;border-radius:16px;margin-top:20px;font-size:24px}.line{display:flex;justify-content:space-between;padding:10px 0}.name{color:var(--blue);font-size:1.5rem;font-weight:900}.ok{color:#000}.ng{color:red}canvas{position:fixed;inset:0;pointer-events:none}</style></head><body><canvas id=c></canvas><div class=page><h1 style="text-align:center">今日って何月何日の<br>何曜日だっけ？</h1><div class=card><div class=header><div class='ring l'></div><div class='ring r'></div></div><div class=content><div class=guide>わかる範囲でえらんでね</div><div id=extra></div><div class=md><div class=grp><input id=m class=date type=number><div class=lbl>月</div></div><div class=grp><input id=d class=date type=number><div class=lbl>日</div></div></div><div class=weekday><select id=w class=week><option></option><option>日</option><option>月</option><option>火</option><option>水</option><option>木</option><option>金</option><option>土</option></select><div class=lbl>曜日</div></div><button id=b class=btn>こたえあわせ</button><div id=res></div><div id=badge></div></div></div><div>正解数 <span id=sc>0</span>/<span id=tot>0</span></div><div>連続 <span id=st>0</span>日</div></div><script>if('serviceWorker'in navigator){navigator.serviceWorker.register('service-worker.js')}const t=new Date(),Y=t.getFullYear(),M=t.getMonth()+1,D=t.getDate(),WD=['日','月','火','水','木','金','土'][t.getDay()];let total=3;tot.textContent=total;document.getElementById('b').onclick=()=>{let s=0,r='';[['月',Number(m.value)==M,M+'月'],['日',Number(d.value)==D,D+'日'],['曜日',w.value==WD,WD+'曜日']].forEach(v=>{if(v[1])s++;r+=`<div class=line><span class=name>${v[0]} <span class='${v[1]?'ok':'ng'}'>${v[1]?'○':'✕'}</span></span><span>正解:${v[2]}</span></div>`});sc.textContent=s;res.innerHTML=r;if(s===3){conf();}};function conf(){const cv=document.getElementById('c'),x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;let p=[...Array(80)].map(()=>({x:Math.random()*cv.width,y:0,v:2+Math.random()*4,c:`hsl(${Math.random()*360},100%,50%)`}));let f=0;(function a(){x.clearRect(0,0,cv.width,cv.height);p.forEach(o=>{o.y+=o.v;x.fillStyle=o.c;x.fillRect(o.x,o.y,5,5)});if(f++<120)requestAnimationFrame(a)})()}</script></body></html>
