<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Date Quiz V3</title><style>body{
    font-family:sans-serif;
    background:#f3dbe4;
    margin:0;
    padding:16px;
}

.page{
    max-width:480px;
    margin:auto;
}

.card{
    background:#fff;
    border-radius:24px;
    overflow:hidden;
}

.head{
    height:90px;
    background:#dfb53d;
    position:relative;
}

.ring{
    position:absolute;
    top:16px;
    width:22px;
    height:56px;
    background:#6b4a2f;
    border-radius:12px;
}

.l{
    left:25%;
}

.r{
    right:25%;
}

.content{
    padding:20px;
}

.guide{
    text-align:center;
    color:#d96c72;
    font-size:24px;
}

.md{
    display:flex;
    justify-content:center;
    gap:24px;
}

.date{
    width:96px;
    height:96px;
    font-size:52px;
    text-align:center;
}

/* 月・日の文字を小さく */

.lbl{
    color:#3b6fd6;
    font-weight:800;
    text-align:center;
    font-size:12px;
}

/* 曜日欄 */

.weekday{
    text-align:center;
    margin-top:20px;
}

.week{

    width:210px;

    height:120px;

    font-size:64px;

    font-weight:bold;

    text-align:center;

    border:2px solid #cccccc;

    border-radius:12px;

    background:#ffffff;

    color:#333333;

    -webkit-appearance:menulist;
    appearance:menulist;
}
/* こたえあわせ */

.btn{

    width:100%;

    height:90px;

    border:none;

    border-radius:20px;

    margin-top:12px;

    background:#7aa9ad;

    color:#ffffff;

    font-size:48px;

    font-weight:900;
}
/* リセット */

.reset{

    width:100%;

    height:75px;

    border:none;

    border-radius:20px;

    margin-top:12px;

    background:#dddddd;

    color:#333333;

    font-size:40px;

    font-weight:900;
}

.ok{
    color:#000;
}

.ng{
    color:red;
}

.name{
    color:#3b6fd6;
    font-size:1.4rem;
    font-weight:900;
}

.line{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
}

canvas{
    position:fixed;
    inset:0;
    pointer-events:none;
}</style></head><body><canvas id=c></canvas><div class=page><h1 style=text-align:center>今日って何月何日の<br>何曜日だっけ？</h1><div class=card><div class=head><div class='ring l'></div><div class='ring r'></div></div><div class=content><div class=guide>わかる範囲でえらんでね</div><div id=extra></div><div class=md><div><input id=m class=date type=number><div class=lbl>月</div></div><div><input id=d class=date type=number><div class=lbl>日</div></div></div><div class=weekday><select id=w class=week><option></option><option>日</option><option>月</option><option>火</option><option>水</option><option>木</option><option>金</option><option>土</option></select><div class=lbl>曜日</div></div><button id=check class=btn>こたえあわせ</button><button id=reset class=reset>リセット</button><div id=answered></div><div id=res></div></div></div><div>正解数 <span id=sc>0</span>/<span id=tot>0</span></div><div>連続 <span id=st>0</span>日</div></div><script>const t=new Date(),Y=t.getFullYear(),M=t.getMonth()+1,D=t.getDate(),WD=['日','月','火','水','木','金','土'][t.getDay()];const monthKey=Y+'-'+M;let total=3;tot.textContent=total;const todayKey=`${Y}-${M}-${D}`;let answered=localStorage.getItem('answeredDate');if(answered===todayKey)document.getElementById('answered').innerHTML='✅ 本日は回答済みです';document.getElementById('check').onclick=()=>{let s=0,r='';[['月',+m.value===M,M+'月'],['日',+d.value===D,D+'日'],['曜日',w.value===WD,WD+'曜日']].forEach(v=>{if(v[1])s++;r+=`<div class=line><span class=name>${v[0]} <span class='${v[1]?'ok':'ng'}'>${v[1]?'○':'✕'}</span></span><span>正解:${v[2]}</span></div>`});sc.textContent=s;res.innerHTML=r;localStorage.setItem('answeredDate',todayKey);answered.innerHTML='✅ 本日は回答済みです';if(s===3){conf();updateStreak();}};reset.onclick=()=>{m.value='';d.value='';w.selectedIndex=0;res.innerHTML='';};function updateStreak(){let sm=localStorage.getItem('streakMonth');let stv=+localStorage.getItem('streak')||0;let last=localStorage.getItem('lastPerfect');if(sm!==monthKey){stv=0;localStorage.setItem('streakMonth',monthKey)}if(last!==todayKey){stv++;localStorage.setItem('streak',stv);localStorage.setItem('lastPerfect',todayKey);}st.textContent=stv;}st.textContent=localStorage.getItem('streak')||0;function conf(){const cv=c,x=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;let p=[...Array(150)].map(()=>({x:Math.random()*cv.width,y:-20,v:2+Math.random()*5,c:`hsl(${Math.random()*360},100%,50%)`}));let f=0;(function a(){x.clearRect(0,0,cv.width,cv.height);let alive=0;p.forEach(o=>{o.y+=o.v;if(o.y<cv.height+20){alive++;x.fillStyle=o.c;x.fillRect(o.x,o.y,6,6)}});if(f++<220&&alive>0)requestAnimationFrame(a);else x.clearRect(0,0,cv.width,cv.height);})();}</script></body></html>
